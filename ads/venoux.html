<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Venoux Ad</title>
	<meta name="robots" content="noindex, nofollow" />
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #0B0B0F;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.ad-container {
			width: 100%;
			max-width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.adsbygoogle {
			display: block;
			width: 100%;
			min-height: 90px;
		}
	</style>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3315122838042047" crossorigin="anonymous"></script>
</head>
<body>
	<div class="ad-container">
		<!-- Venoux -->
		<ins class="adsbygoogle"
			 style="display:block"
			 data-ad-client="ca-pub-3315122838042047"
			 data-ad-slot="4439543032"
			 data-ad-format="auto"
			 data-full-width-responsive="true"></ins>
		<script>
			 (adsbygoogle = window.adsbygoogle || []).push({});
		</script>
	</div>
</body>
</html>
